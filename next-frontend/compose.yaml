services:
  next-frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3001:3000
    volumes:
      - .:/home/node/app
    environment:
      API_URL: http://upstream.test
      SESSION_PASSWORD: streamtube-session-password-123456789012
      MSW_ENABLED: "true"
    command: sh -c "npx next dev --port 3000 --hostname 0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
