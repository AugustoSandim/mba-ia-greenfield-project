# Full local stack: backend + frontend on the same Docker network.
name: streamtube-full

services:
  nestjs-api:
    build:
      context: ./nestjs-project
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./nestjs-project:/home/node/app
    env_file:
      - ./nestjs-project/.env
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  video-worker:
    build:
      context: ./nestjs-project
      dockerfile: Dockerfile.worker
    volumes:
      - ./nestjs-project:/home/node/app
    env_file:
      - ./nestjs-project/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      [
        "npx",
        "ts-node",
        "-r",
        "tsconfig-paths/register",
        "src/main.worker.ts",
      ]

  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: streamtube
      POSTGRES_PASSWORD: streamtube
      POSTGRES_DB: streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/streamtube &&
      exit 0
      "

  next-frontend:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ./next-frontend:/home/node/app
    environment:
      API_URL: http://nestjs-api:3000
      SESSION_PASSWORD: streamtube-session-password-123456789012
    depends_on:
      nestjs-api:
        condition: service_started

volumes:
  redis_data:
  minio_data:
